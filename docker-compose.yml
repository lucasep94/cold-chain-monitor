services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    # .env.example gives working defaults; a local .env (optional) overrides them.
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/coldchain
    ports:
      - '3000:3000'
    depends_on:
      mongo:
        condition: service_healthy

  # Demo only: docker compose --profile demo up (run `pnpm --filter api seed` first).
  simulator:
    profiles: ['demo']
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      API_URL: http://api:3000/api/v1
    volumes:
      - ./simulator/keys.json:/app/keys.json:ro
    command: ['--interval', '5']
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
